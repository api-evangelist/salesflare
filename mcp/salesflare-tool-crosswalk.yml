note: >-
  Salesflare's MCP tool manifest is OAuth-gated — POST tools/list to
  https://mcp.salesflare.com/mcp returns 401 invalid_token — so no MCP tool NAMES
  were observed. What Salesflare does publish is a six-item capability list on its
  own MCP integration listing. Each row below is therefore a CAPABILITY GROUP, not
  a tool name, bound to the REST operationIds that implement it. Every operationId
  was grepped out of the live spec; none are invented. Confidence is capped at
  medium for that reason: the binding is semantically sound but the tool
  granularity (one tool per capability vs one per object vs one per operation) is
  unknown until an authenticated introspection is run.
