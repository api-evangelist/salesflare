source: live GET of /.well-known/* on every Salesflare host in apis.yml and openapi servers[]
note: >-
  Two real documents are served. api.salesflare.com publishes RFC 8414 OAuth 2.0
  Authorization Server Metadata for its OIDC provider (issuer
  https://api.salesflare.com/oidc) and RFC 9728 OAuth 2.0 Protected Resource
  Metadata pointing at the hosted MCP server. mcp.salesflare.com serves the same
  pair. salesflare.com answers every /.well-known/* path with an HTML page
  reading "Invalid .well-known request" under a 404 — recorded as a miss, not a
  document. No security.txt, no api-catalog, no ai-plugin.json, no agent card on
  any host.
