method: derived
source: >-
  openapi/_original/salesflare-openapi.json,
  well-known/salesflare-well-known.yml, and live probes of
  https://api.salesflare.com and https://mcp.salesflare.com
note: >-
  Salesflare's standards posture is lopsided and interesting: its REST contract is
  two major versions behind (Swagger 2.0, no declared security, no error schema),
  while its agent surface is close to state of the art (MCP over Streamable HTTP,
  RFC 8414 + RFC 9728 discovery, OIDC with PKCE/DPoP/PAR and dynamic client
  registration). No published compliance certifications were found on any
  Salesflare property, so no Compliance pointer is emitted.
