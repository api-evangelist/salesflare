compliance_certifications:
  found: []
  note: >-
    No trust center, no security page and no named certification (SOC 2, ISO
    27001, PCI DSS, HIPAA, FedRAMP) was found on any Salesflare property.
    salesflare.com/security, /trust, /gdpr and /security-and-privacy all return
    404. Salesflare publishes a Terms of Use and a Privacy Policy only. Third-party
    vendor pages asserting Salesflare "supports SOC 2 / ISO 27001" describe the
    vendor's own evidence-collection integration, not a Salesflare certification,
    and are not treated as provider evidence here.
