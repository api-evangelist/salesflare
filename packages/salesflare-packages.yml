note: >-
  THE HEADLINE FINDING IS AN ABSENCE. Salesflare ships NO first-party client SDK
  for its public REST API in any language. npm, PyPI, RubyGems and crates.io were
  all queried; PyPI, RubyGems and crates.io return nothing at all for
  "salesflare", and the 31 npm hits under the Salesflare name are internal
  platform libraries (a Joi fork, hapi plugins, an eslint config, Cordova plugin
  forks) plus vendor SDK forks for FullContact and Nylas. None of them wrap
  api.salesflare.com. The provider's own docs point developers at Postman and the
  raw OpenAPI instead of an SDK, so no `SDKs` pointer is emitted for this
  provider — emitting one would credit a client library that does not exist.
  Listed below are the first-party packages that are genuinely API-adjacent, and
  the one third-party MCP package, clearly marked.
