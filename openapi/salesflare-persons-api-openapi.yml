  description: '# Introduction


    ## Getting Started


    The Salesflare API allows you to access and build your own applications or integrations that interact with Salesflare.'
  contact:
    email: support@salesflare.com
  x-logo:
    url: https://lib.salesflare.com/api_docs/sf-logo-inverted.svg
    backgroundColor: '#0f1528'
    altText: Salesflare logo
servers:
- url: https://api.salesflare.com
tags:
- name: Persons
paths:
  /persons:
    get:
      summary: List persons
      operationId: getPersons
      parameters:
      - x-constraint:
          single: true
        name: id
        in: query
        explode: true
        schema:
          type: array
          items:
            type: number
      - name: name
        in: query
        schema:
          type: string
      - name: email
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      tags:
      - Persons
      responses:
        default:
          description: Successful
          content:
            '*/*':
              schema:
                type: string
