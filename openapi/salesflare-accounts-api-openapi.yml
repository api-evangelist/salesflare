      description: Get an account's feed which includes emails, messages, meetings, and other activities
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: number
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        schema:
          type: string
          format: date-time
          default: '1970-01-01T00:00:00.000Z'
