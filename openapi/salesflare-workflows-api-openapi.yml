  /workflows/{id}/audience/{record_id}:
    put:
      summary: Re-enter or exit an entity from a workflow
      operationId: putWorkflowsIdAudienceRecord_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
      - description: This is the entity id. For email workflows this should be the contact id.
        name: record_id
        in: path
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exited:
                  type: boolean
                  description: Setting `exited` to `true` will exit the entity from the workflow. Setting `exited` to `false` will re-enter the entity into the workflow.
                met_goal:
                  type: boolean
                  description: Setting `met_goal` of a workflow record to `false` is currently not possible.
      tags:
      - Workflows
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                type: object
                properties:
                  success:
                    type: boolean
